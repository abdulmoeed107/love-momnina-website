<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Momnina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1s ease-in;
        }

        .message {
            font-size: 120px;
            font-weight: 900;
            color: white;
            text-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 80px rgba(255, 255, 255, 0.2);
            letter-spacing: 3px;
            margin-bottom: 30px;
            animation: slideDown 1.5s ease-out;
            line-height: 1.2;
        }

        .heart {
            display: inline-block;
            color: #ff6b9d;
            animation: heartbeat 1.2s ease-in-out infinite;
            margin: 0 20px;
        }

        .subtitle {
            font-size: 48px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 40px;
            animation: slideUp 1.5s ease-out;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Animated background particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
            opacity: 0.6;
        }

        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 80%; top: 80%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 50%; top: 10%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 20%; top: 80%; animation-delay: 6s; }
        .particle:nth-child(5) { left: 90%; top: 40%; animation-delay: 8s; }
        .particle:nth-child(6) { left: 30%; top: 60%; animation-delay: 10s; }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.3);
            }
            50% {
                transform: scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-30px);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .message {
                font-size: 60px;
            }

            .subtitle {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .message {
                font-size: 40px;
                letter-spacing: 1px;
            }

            .subtitle {
                font-size: 20px;
                letter-spacing: 1px;
            }

            .heart {
                margin: 0 10px;
            }
        }

        /* Click effect */
        .container:active {
            animation: pulse 0.6s ease-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <!-- Main content -->
    <div class="container">
        <div class="message">
            I <span class="heart">❤️</span> You
        </div>
        <div class="subtitle">MOMNINA</div>
    </div>

    <script>
        // Add some interactivity
        document.addEventListener('click', function() {
            const container = document.querySelector('.container');
            container.style.animation = 'pulse 0.6s ease-out';
            setTimeout(() => {
                container.style.animation = '';
            }, 600);
        });

        // Optional: Add confetti effect on load
        function createConfetti() {
            const colors = ['#ff6b9d', '#feca57', '#48dbfb', '#1dd1a1'];
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.width = '10px';
            confetti.style.height = '10px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * window.innerWidth + 'px';
            confetti.style.top = '-10px';
            confetti.style.pointerEvents = 'none';
            confetti.style.borderRadius = '50%';
            
            document.body.appendChild(confetti);
            
            let top = -10;
            const speed = Math.random() * 3 + 2;
            const direction = (Math.random() - 0.5) * 4;
            
            const fall = setInterval(() => {
                top += speed;
                confetti.style.left = (parseFloat(confetti.style.left) + direction) + 'px';
                confetti.style.top = top + 'px';
                
                if (top > window.innerHeight) {
                    clearInterval(fall);
                    confetti.remove();
                }
            }, 20);
        }

        // Create confetti on page load
        window.addEventListener('load', () => {
            for (let i = 0; i < 30; i++) {
                setTimeout(createConfetti, i * 50);
            }
        });
    </script>
</body>
</html>
